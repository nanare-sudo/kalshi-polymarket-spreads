name: Refresh live market data

on:
  schedule:
    - cron: "*/20 * * * *"    # alle 20 Minuten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build live.json
        run: python3 scripts/build_live_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          git diff --staged --quiet || git commit -m "data: refresh live market snapshot"
          git push || true
